<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Terintegrasi Rangkaian Informasi Aktifitas Praktik Kerja Lapangan(PKL) MAN 1 Kota Cirebon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #F8FAFC; font-family: 'Montserrat', sans-serif; }
        
        /* Layar pemuatan awal yang elegan */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #00A39D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Tombol Kembali Melayang (Floating Back Button) */
        .btn-back-portal {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background-color: #005A2B;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 9999px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 90, 43, 0.3);
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn-back-portal:hover {
            background-color: #004220;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 90, 43, 0.4);
        }
        .btn-back-portal svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        .btn-back-portal:hover svg {
            transform: translateX(-3px);
        }

        /* Bingkai aplikasi utama yang memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi loading saat pertama kali dibuka -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 style="color: #1E293B; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em;">WELCOME TO SATRIA</h3>
        <p style="color: #64748B; font-size: 11px; margin-top: 4px;">Aplikasi Pendaftaran Praktik Kerja Lapangan MAN 1 Kota Cirebon</p>
    </div>

    <!-- TOMBOL KEMBALI MENGGUNAKAN DOMAIN KUSTOM & TARGET="_TOP" -->
    <a href="https://yfaksara.my.id/" target="_top" class="btn-back-portal">
        <svg viewBox="0 0 24 24">
            <path d="M19 12H5"></path>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Kembali ke Portal
    </a>

    <!-- Memuat seluruh sistem aplikasi Google Apps Script secara transparan -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbwqyMyXeYPI7HoMr-N3GThd8u4gABRBTAnVQ8ZPERbCC5d_i3bt4e2c1DYplRGTgG3Y/exec" 
            onload="document.getElementById('loading-screen').style.opacity='0'; setTimeout(()=>document.getElementById('loading-screen').style.display='none', 400);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>

</body>
</html>
